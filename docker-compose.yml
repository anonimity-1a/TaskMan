version: "3.8"

services:
  web:
    build: .
    container_name: taskman
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: production
      PORT: "5173"
      TASKMAN_DATA: /data/taskman.json
      TASKMAN_LEGACY: /data/document.json
      TASKMAN_JWT_SECRET: ${TASKMAN_JWT_SECRET:?Set TASKMAN_JWT_SECRET}
    volumes:
      - taskman-data:/data
    restart: always

volumes:
  taskman-data:
