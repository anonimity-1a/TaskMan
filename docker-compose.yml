version: "3.8"

services:
  web:
    build: .
    container_name: taskman
    ports:
      - "5173:5173"
    environment:
      PORT: "5173"
      TASKMAN_DATA: /data/document.json
      TASKMAN_TOKEN: ${TASKMAN_TOKEN:-change-me}
    volumes:
      - taskman-data:/data
    restart: always

volumes:
  taskman-data:
